# 공통 설정. 로컬, 운영, 테스트 모두 이 파일을 읽고, 프로필별 파일(application-<프로필>.yml)이 덮어쓴다.
# 주소는 환경 변수가 없으면 로컬 기본값을 쓴다. 비밀 값은 기본값이 없어서, 설정하지 않으면 서버가 켜지지 않는다.
spring:
  profiles:
    # 프로필을 지정하지 않고 실행하면 local 프로필 (application-local.yml)
    default: local
  datasource:
    # 로컬은 H2 메모리 DB. 운영(prod)은 환경 변수로 MySQL을 지정한다 (5-2)
    url: ${DB_URL:jdbc:h2:mem:accounts}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    defer-datasource-initialization: true
  h2:
    console:
      enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

server:
  port: ${PORT:9000}
  # Next.js(accounts 화면)가 요청을 넘겨줄 때 붙이는 X-Forwarded-Host/Proto를 보고, 사용자가 접속한 주소 기준으로 리다이렉트 주소를 만든다.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # 같은 컴퓨터에서 실행하는 blog 서버의 세션 쿠키와 섞이지 않도록 이름을 정한다.
        name: ACCOUNTS_SESSION

accounts:
  # 인가 서버의 주소(사용자와 앱이 접속하는 주소). 토큰의 iss 클레임과 설정 문서에 들어간다.
  # 로컬에서는 accounts 화면(Next.js)의 주소다. Next.js가 인가 서버 주소들을 이 서버로 넘겨준다.
  issuer: ${ACCOUNTS_ISSUER:http://localhost:3001}
  clients:
    blog:
      client-secret: ${BLOG_CLIENT_SECRET}
      redirect-uri: ${BLOG_REDIRECT_URI:http://localhost:3000/login/oauth2/code/accounts}
      post-logout-redirect-uri: ${BLOG_POST_LOGOUT_REDIRECT_URI:http://localhost:3000/}
  remember-me:
    # 로그인 상태 유지 쿠키의 서명 키
    key: ${REMEMBER_ME_KEY}
