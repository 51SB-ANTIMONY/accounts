# 운영 설정. SPRING_PROFILES_ACTIVE=prod로 켠다. 값은 모두 환경 변수로 받는다.
#
# 필요한 환경 변수
#   DB_URL, DB_USERNAME, DB_PASSWORD     DB 접속 정보. MySQL 주소에는 시각을 정확히 저장하는 옵션을 붙인다:
#     jdbc:mysql://<호스트>:3306/accounts?preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
#   ACCOUNTS_ISSUER                      예: https://accounts.antimony.kr
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
#   BLOG_CLIENT_SECRET                   blog 서버의 ACCOUNTS_CLIENT_SECRET과 같은 값
#   BLOG_REDIRECT_URI                    예: https://blog.antimony.kr/login/oauth2/code/accounts
#   BLOG_POST_LOGOUT_REDIRECT_URI        예: https://blog.antimony.kr/
#   REMEMBER_ME_KEY                      로그인 상태 유지 쿠키 서명 키 (임의의 긴 문자열)
#   SIGNING_KEY_PATH 또는 SIGNING_KEY_BASE64   토큰 서명용 RSA 개인 키 (파일 경로 또는 한 줄 내용). 만드는 법:
#     openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out signing-key.pem
#     한 줄 내용: grep -v -- ----- signing-key.pem | tr -d '\n'
#   SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD   인증 메일을 보낼 SMTP 서버
#     (예: Gmail은 smtp.gmail.com, 587, Gmail 주소, 앱 비밀번호). 비워 두면 메일 대신 서버 로그에 인증번호를 남긴다
#   MAIL_FROM                            (선택) 보내는 사람 주소
server:
  servlet:
    session:
      cookie:
        # 운영은 HTTPS로만 접속하므로 세션 쿠키를 HTTPS 연결에서만 보내게 한다.
        # (CSRF, 로그인 상태 유지 쿠키는 요청이 HTTPS일 때 자동으로 Secure가 붙는다. 앞단이 X-Forwarded-Proto: https를 넘겨야 한다)
        secure: true

spring:
  datasource:
    # 운영에서는 기본값(H2)을 쓰지 않는다. 설정하지 않으면 서버가 켜지지 않는다.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
  mail:
    # SMTP_HOST 등을 설정하면 실제 메일을 보낸다 (SmtpVerificationMailSender)
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  h2:
    console:
      enabled: false

accounts:
  signing-key:
    # 운영에서는 반드시 저장해 둔 키를 쓴다. 둘 다 없으면 서버가 켜지지 않는다.
    required: true
